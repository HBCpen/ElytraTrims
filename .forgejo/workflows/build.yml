name: Build
on: push

jobs:
  setup:
    name: Setup
    runs-on: kiku-server
    container: alpine
    outputs:
      projects: ${{ steps.set-versions.outputs.projects }}
    steps:
      - name: Setup deps
        run: |
          apk add --no-cache git jq nodejs
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Extract versions
        id: set-versions
        run: |
          set -x
          PROJECTS=$(jq -c '.versions | map(split(":") | { project: .[0], version: .[1] })' versions.json)
          echo "projects=$PROJECTS" >> "$FORGEJO_OUTPUT"
  build:
    name: Build
    needs: setup
    runs-on: kiku-server
    container: eclipse-temurin:25-jdk-alpine
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.projects) }}
    steps:
      - name: Setup deps
        run: |
          apk add --no-cache git jq nodejs
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CB_TOKEN }}
      - name: Setup Gradle
        run: |
          chmod +x ./gradlew
      - name: Build version
        env:
          MATRIX_INSTANCE: ${{ matrix.project }}
          MATRIX_VERSION: ${{ matrix.version }}
        run: |
          ./gradlew build --stacktrace --no-daemon
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-libs-${{ matrix.project }}
          path: versions/${{ matrix.project }}/build/libs/*